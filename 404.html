<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Halaman Tidak Ditemukan | aceimp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }
    header {
      height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
    }
    .logo { font-size: 24px; font-weight: 800; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }
    .code {
      margin: 0;
      color: #1685e8;
      font-size: clamp(72px, 18vw, 120px);
      line-height: 1;
    }
    h1 { margin: 20px 0 10px; font-size: 25px; }
    p { max-width: 420px; margin: 0; color: #777; line-height: 1.6; }
    .home-button {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 20px;
      border-radius: 9px;
      background: #1685e8;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">aceimp</div>
  </header>
  <main>
    <p class="code">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Maaf, halaman yang kamu cari tidak tersedia atau alamatnya sudah berubah.</p>
    <a class="home-button" href="/">Kembali ke halaman utama</a>
  </main>
</body>
</html>
